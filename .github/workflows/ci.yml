name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preparar base de datos (SQLite)
        run: |
          cp .env.example .env
          bunx prisma generate
          bunx prisma db push

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
